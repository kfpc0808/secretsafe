<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1F2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>길동의 Secret Safe</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* hide scrollbars across all browsers (removes the thin vertical scrollbar line) */
*{scrollbar-width:none; -ms-overflow-style:none}
*::-webkit-scrollbar{display:none; width:0; height:0}
html,body{scrollbar-width:none; -ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  background:radial-gradient(ellipse at 50% 0%, #ECEAE4 0%, #DAD7CE 55%, #CDC9BE 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
}

/* ════════ PHONE (variable-driven) ════════ */
.phone{
  width:338px; height:720px; border-radius:34px; padding:0; position:relative; flex-shrink:0;
  background:transparent;
  box-shadow:none;
}
.phone::before{display:none}
.screen{width:100%; height:100%; border-radius:34px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; font-family:var(--sans); color:var(--ink); position:relative}
.screen, .screen *{transition:background-color .45s ease, color .45s ease, border-color .45s ease}

.statusbar{height:42px; display:flex; justify-content:space-between; align-items:flex-end; padding:0 26px 6px; font-size:11px; font-weight:700; color:var(--ink); flex-shrink:0}
.appheader{padding:15px 17px 16px; background:var(--header-bg); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; position:relative}
.appheader::after{content:''; position:absolute; bottom:-1px; left:17px; width:46px; height:2px; background:linear-gradient(90deg,var(--accent-deep),var(--accent),transparent)}
.brand{display:flex; align-items:center; gap:11px}
.brand-tx{display:flex; flex-direction:column; min-width:0}
.brand-logo{flex-shrink:0; display:flex; align-items:center; font-family:var(--serif-h); font-weight:700; font-size:28px; line-height:1; letter-spacing:-.01em; color:var(--accent-deep)}
.brand .label{font-size:8.5px; letter-spacing:.3em; color:var(--accent-deep); text-transform:uppercase; font-weight:800}
.brand .name{font-family:var(--serif-h); font-size:19px; color:var(--ink); font-weight:600; line-height:1.1; margin-top:3px}
.brand .name em{font-style:italic; color:var(--accent-deep)}
.h-acts{display:flex; gap:7px; align-items:center}
.theme-badge{
  display:flex; align-items:center; justify-content:center; width:36px; height:36px; font-size:15px; font-weight:800;
  color:var(--accent-deep); background:var(--accent-bg); border:1px solid var(--accent-soft);
  padding:0; border-radius:50%; cursor:pointer; user-select:none; flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.theme-badge:hover{filter:brightness(1.04)}
.theme-badge:active{transform:scale(.96)}
/* ── 홈 브랜드 헤더: 시안2 고동색→골드 우측 그라데이션 + 골드 테두리 (모바일·PC 공통) ── */
.view-home .appheader{background:linear-gradient(90deg,#43302A 0%,#6B5236 65%,#8B6F3F 100%); border-bottom:1.5px solid var(--accent-soft)}
.view-home .appheader .brand .label{color:var(--accent-soft)}
.view-home .appheader .brand .name{color:#F2E6CC}
.view-home .appheader .brand .name em{color:#E4C98A}
.view-home .appheader .theme-badge{color:var(--accent-soft); background:rgba(201,169,110,.14); border-color:rgba(220,195,148,.5); box-shadow:none}
.view-home .appheader .h-btn{color:var(--accent-soft); background:rgba(201,169,110,.14); border-color:rgba(220,195,148,.5)}
.view-home .appheader .brand-logo{background:linear-gradient(135deg,#F8EBC2,#E4C075); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#EBCF8C; filter:drop-shadow(0 1px 1.5px rgba(35,24,10,.30))}
.view-home .appheader::after{left:62px; width:56px}
.h-btn{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; background:var(--btn-bg); border:1px solid var(--line); color:var(--ink-soft); flex-shrink:0}

.body{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:13px}
.body::-webkit-scrollbar{display:none}
.seclabel{font-size:9.5px; letter-spacing:.3em; color:var(--accent-deep); text-transform:uppercase; font-weight:800; display:flex; align-items:center; gap:8px; margin:4px 2px 0}
.seclabel::before,.seclabel::after{content:''; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--accent-soft),transparent)}
.seclabel::before{max-width:15px; background:linear-gradient(90deg,var(--accent-soft),transparent)}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{background:var(--t-bg); border:1.5px solid var(--t-line); border-radius:15px; padding:14px 12px; position:relative; overflow:hidden; min-height:114px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:8px}
.tile::before{content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--t-bar)}
.tile .roman{position:absolute; top:12px; right:13px; font-family:var(--serif-h); font-style:italic; font-size:12px; color:var(--t-ic); opacity:.55}
.tile .icon-wrap{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; background:var(--t-icbg); box-shadow:var(--shadow-sm)}
.tile .name{font-size:13px; font-weight:700; color:var(--ink); letter-spacing:-.01em}
.tile .desc{font-size:10px; color:var(--mute); line-height:1.45; font-weight:500}

.card{background:var(--bg-card); border:1px solid var(--line); border-radius:15px; padding:14px 16px; box-shadow:var(--shadow-sm)}
.chead{display:flex; align-items:center; gap:8px; margin-bottom:11px; padding-bottom:9px; border-bottom:1px solid var(--line-soft)}
.chead .ic{font-size:14px}
.chead .t{font-size:12px; font-weight:700; color:var(--ink); flex:1}
.chead .more{font-size:9px; letter-spacing:.05em; font-weight:800; color:var(--accent-deep); text-transform:uppercase}

.read{display:flex; align-items:center; gap:13px; background:var(--accent-card); border:1px solid var(--accent-soft); border-radius:15px; padding:14px 16px; box-shadow:var(--shadow-sm)}
.read .ic{width:44px; height:44px; border-radius:13px; background:var(--bg-card); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; box-shadow:var(--shadow-sm); border:1px solid var(--accent-soft)}
.read .t{font-size:14px; font-weight:700; color:var(--ink)}
.read .d{font-size:11px; color:var(--mute); margin-top:2px; font-weight:500}
.read .badge{margin-left:auto; font-size:9px; font-weight:800; color:var(--accent-deep); background:var(--bg-card); border:1px solid var(--accent-soft); padding:3px 9px; border-radius:100px; flex-shrink:0}

.simgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sim{display:flex; align-items:center; gap:9px; padding:11px 10px; border-radius:12px; background:var(--accent-bg); border:1px solid var(--accent-soft)}
.sim .si{width:30px; height:30px; border-radius:9px; background:var(--bg-card); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; box-shadow:var(--shadow-sm)}
.sim .st{font-size:12px; font-weight:700; color:var(--ink)}
.sim .sd{font-size:9px; color:var(--mute); margin-top:1px}

.srow{display:flex; align-items:center; gap:10px; padding:8px 0}
.srow+.srow{border-top:1px dashed var(--line-soft)}
.dday{font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; flex-shrink:0}
.dday.near{background:var(--warn-bg); color:var(--warn)}
.dday.far{background:var(--accent-bg); color:var(--accent-deep)}
.srow .sn{font-size:12px; font-weight:600; color:var(--ink-soft)}
.srow .sw{margin-left:auto; font-size:11px; color:var(--mute); font-weight:600}

.info .fi{display:flex; gap:10px; padding:8px 0; font-size:11px; color:var(--ink-soft); line-height:1.45; font-weight:500; border-bottom:1px dashed var(--line-soft); align-items:flex-start}
.info .fi:last-child{border-bottom:0; padding-bottom:0}
.info .fic{width:24px; height:24px; border-radius:7px; background:var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0}
.info .ft{flex:1}
.info .ft-time{font-size:9px; color:var(--dim); font-weight:700; flex-shrink:0}

.promise{background:var(--promise-bg); border:1px solid var(--accent-soft); border-radius:15px; padding:16px 17px; position:relative; overflow:hidden}
.promise::after{content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:linear-gradient(180deg,var(--accent),var(--accent-deep))}
.promise .ph{font-size:9.5px; letter-spacing:.3em; color:var(--accent-deep); text-transform:uppercase; font-weight:800; padding-bottom:10px; margin-bottom:8px; border-bottom:1px dashed var(--accent-soft)}
.promise .ph::before{content:'✦ '; color:var(--accent)}
.promise .pi{display:flex; gap:10px; align-items:center; padding:8px 0}
.promise .pi+.pi{border-top:1px dotted var(--accent-soft)}
.promise .pn{font-family:var(--serif-h); font-style:italic; font-size:14px; font-weight:600; color:var(--accent-deep); min-width:22px}
.promise .pt{font-size:12.5px; font-weight:600; color:var(--ink); letter-spacing:-.01em}

.nav{height:66px; background:var(--header-bg); border-top:1px solid var(--accent-soft); display:flex; justify-content:space-around; align-items:center; padding:6px 12px 12px; flex-shrink:0}
.nav .ni{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9.5px; color:var(--mute); font-weight:600; flex:1}
.nav .ni .nic{font-size:17px}
.nav .ni.on{color:var(--accent-deep)}

/* ════════ THEME A — 부띠끄 아이보리 (기본) ════════ */
.theme-ivory{
  --bg:#F8F4ED; --bg-card:#FFFFFF; --header-bg:linear-gradient(180deg,#FFFFFF,#FFF8E7);
  --ink:#1A1F2E; --ink-soft:#3D4458; --mute:#6B6759; --dim:#A8A293;
  --line:#E8DFCC; --line-soft:#F0E8D8; --btn-bg:#FFFFFF;
  --accent:#C9A96E; --accent-deep:#8B6F3F; --accent-soft:#DCC394; --accent-bg:#FBF5E6;
  --accent-card:linear-gradient(135deg,#FFFFFF,#F0EBF4); --promise-bg:linear-gradient(135deg,rgba(201,169,110,.12),#FFFFFF);
  --warn:#B6603F; --warn-bg:#FBF1E8;
  --frame:linear-gradient(135deg,#2A2D3B,#1A1F2E); --frame-edge:rgba(201,169,110,.4);
  --serif-h:'Cormorant Garamond',Georgia,serif; --sans:'Pretendard Variable',Pretendard,sans-serif;
  --shadow-sm:0 2px 6px rgba(139,111,63,.07); --shadow:0 6px 18px rgba(139,111,63,.12);
  --t-bg:#FFFFFF; --t-line:#E8DFCC; --t-bar:var(--accent); --t-icbg:#FBF5E6; --t-ic:var(--accent-deep);
}
.theme-ivory .tile.m1{--t-line:#E8C8AB; --t-bar:linear-gradient(180deg,#C97755,#B6603F); --t-icbg:#FBF1E8; --t-ic:#C97755}
.theme-ivory .tile.m2{--t-line:#BFD2C2; --t-bar:linear-gradient(180deg,#6B8E6F,#587562); --t-icbg:#EDF3ED; --t-ic:#6B8E6F}
.theme-ivory .tile.m3{--t-line:#BCCBDA; --t-bar:linear-gradient(180deg,#5A7595,#4A6280); --t-icbg:#ECF1F6; --t-ic:#5A7595}
.theme-ivory .tile.m4{--t-line:#DDC0C0; --t-bar:linear-gradient(180deg,#9B5A5A,#804848); --t-icbg:#F5E8E8; --t-ic:#9B5A5A}
.theme-ivory .tile.m5{--t-line:#CFC2DD; --t-bar:linear-gradient(180deg,#7B6299,#614F7E); --t-icbg:#F0EBF4; --t-ic:#7B6299}
.theme-ivory .tile.m6{--t-line:#E8D499; --t-bar:linear-gradient(180deg,#C9A96E,#8B6F3F); --t-icbg:linear-gradient(135deg,#DCC394,#8B6F3F); --t-ic:#fff}

/* ════════ THEME B — 하프다크 네이비 (색 포인트) ════════ */
.theme-vault{
  --bg:linear-gradient(180deg,#323D5A,#29334D); --bg-card:#3C4869; --header-bg:linear-gradient(180deg,#374264,#2D3852);
  --ink:#ECEEF5; --ink-soft:#C4CAD9; --mute:#9198AD; --dim:#6A718A;
  --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07); --btn-bg:rgba(255,255,255,.08);
  --accent:#E0C58F; --accent-deep:#E8D3A2; --accent-soft:rgba(224,197,143,.34); --accent-bg:rgba(224,197,143,.14);
  --accent-card:linear-gradient(135deg,rgba(224,197,143,.14),rgba(255,255,255,.04)); --promise-bg:linear-gradient(135deg,rgba(224,197,143,.12),rgba(255,255,255,.03));
  --warn:#F0976B; --warn-bg:rgba(240,151,107,.20);
  --frame:linear-gradient(135deg,#1B2238,#2D3852); --frame-edge:rgba(224,197,143,.45);
  --serif-h:'Cormorant Garamond',Georgia,serif; --sans:'Pretendard Variable',Pretendard,sans-serif;
  --shadow-sm:0 2px 8px rgba(8,12,28,.3); --shadow:0 8px 22px rgba(8,12,28,.42);
  --t-bg:#3C4869; --t-line:rgba(255,255,255,.12); --t-bar:linear-gradient(180deg,#E0C58F,#A6863F); --t-icbg:rgba(224,197,143,.16); --t-ic:#E8D3A2;
}
.theme-vault .tile.m1{--t-bar:linear-gradient(180deg,#E0926E,#C2674A); --t-icbg:rgba(224,146,110,.20); --t-ic:#EDA988}
.theme-vault .tile.m2{--t-bar:linear-gradient(180deg,#86B68B,#5E8A66); --t-icbg:rgba(134,182,139,.20); --t-ic:#A4CFA8}
.theme-vault .tile.m3{--t-bar:linear-gradient(180deg,#7FA3CE,#5878A6); --t-icbg:rgba(127,163,206,.20); --t-ic:#A2C0E0}
.theme-vault .tile.m4{--t-bar:linear-gradient(180deg,#D79090,#9B5A5A); --t-icbg:rgba(215,144,144,.20); --t-ic:#E2ABAB}
.theme-vault .tile.m5{--t-bar:linear-gradient(180deg,#AE94D6,#7B6299); --t-icbg:rgba(174,148,214,.20); --t-ic:#C8B6E4}
.theme-vault .tile.m6{--t-bar:linear-gradient(180deg,#E0C58F,#A6863F); --t-icbg:rgba(224,197,143,.22); --t-ic:#E8D3A2}
/* ════════ 화면 전환 (홈 ↔ 만기·알림) ════════ */
.viewport{position:relative; flex:1; overflow:hidden}
.view{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg)}
/* parked (off-screen) slide-in panels must not cast their shadow into the visible screen */
.view:not(.show){box-shadow:none !important}
.view-alerts{transform:translateX(100%); transition:transform .34s cubic-bezier(.3,.7,.3,1); box-shadow:-10px 0 26px rgba(0,0,0,.16); z-index:2}
.view-alerts.show{transform:none}
.alerts-hdr{justify-content:flex-start !important; gap:12px}
.back-btn{font-size:22px; color:var(--ink-soft); cursor:pointer; line-height:1}
.alerts-title{font-family:var(--serif-h); font-size:19px; font-weight:600; color:var(--ink)}
.alerts-hdr .h-btn{margin-left:auto}
.urgent{background:var(--bg-card); border:1px solid var(--line); border-radius:15px; padding:15px 16px; position:relative; overflow:hidden; box-shadow:var(--shadow)}
.urgent::after{content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--warn)}
.u-row{display:flex; align-items:center; gap:10px}
.u-ic{width:40px; height:40px; border-radius:12px; background:var(--warn-bg); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0}
.u-nm{font-size:14px; font-weight:700; color:var(--ink)}
.u-dd{margin-left:auto; font-size:13px; font-weight:800; color:#fff; background:var(--warn); padding:4px 11px; border-radius:100px}
.u-warn{font-size:11.5px; color:var(--warn); font-weight:600; margin:11px 0 12px; line-height:1.5}
.u-btns{display:flex; gap:8px}
.u-btn{flex:1; text-align:center; font-size:12px; font-weight:700; padding:9px 0; border-radius:10px; cursor:pointer}
.u-btn.go{background:linear-gradient(135deg,var(--accent),var(--accent-deep)); color:#2b2622}
.u-btn.ask{background:var(--bg-card); color:var(--ink-soft); border:1px solid var(--line)}
.chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-soft); background:var(--bg-card); border:1px solid var(--line); padding:8px 12px; border-radius:100px; cursor:pointer; box-shadow:var(--shadow-sm)}
.chip.add{color:var(--accent-deep); border-color:var(--accent-soft); background:var(--accent-bg); font-weight:800}
.alert{display:flex; align-items:center; gap:11px; background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow-sm)}
.alert .ai{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:var(--accent-bg)}
.alert .anm{font-size:13px; font-weight:700; color:var(--ink)}
.alert .ameta{font-size:10.5px; color:var(--mute); margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.alert .sync{font-size:8.5px; font-weight:800; color:var(--accent-deep); background:var(--accent-bg); padding:2px 6px; border-radius:5px}
.alert .bells{display:flex; gap:3px}
.alert .b{font-size:8.5px; font-weight:700; color:var(--accent-deep); background:var(--accent-bg); border:1px solid var(--accent-soft); padding:1px 5px; border-radius:5px}
.alert .art{margin-left:auto; text-align:right; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:5px}
.alert .achev{font-size:15px; color:var(--dim)}
.dday.mid{background:var(--accent-bg); color:var(--accent-deep)}
.anote{font-size:10.5px; color:var(--mute); text-align:center; padding:8px 10px 4px; line-height:1.5}
.anote b{color:var(--accent-deep); font-weight:700}
/* ════════ My Docu 허브 ════════ */
.docu-card{display:flex; align-items:center; gap:13px; background:var(--bg-card); border:1px solid var(--line); border-radius:15px; padding:15px 16px; box-shadow:var(--shadow-sm); cursor:pointer; position:relative; overflow:hidden; margin-bottom:11px}
.docu-card::after{content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--dc,var(--accent))}
.docu-card .di{width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; background:var(--dcbg,var(--accent-bg))}
.docu-card .dt{font-size:14px; font-weight:700; color:var(--ink)}
.docu-card .dd{font-size:11px; color:var(--mute); margin-top:2px}
.docu-card .dchev{margin-left:auto; font-size:16px; color:var(--dim)}
.docu-card .dlock{margin-left:auto; font-size:15px}
/* ════════ 비밀번호 금고 — 잠금 ════════ */
.pwlock{display:flex; flex-direction:column; align-items:center; padding:18px 16px; text-align:center}
.lk-ic{font-size:30px}
.lk-t{font-family:var(--serif-h); font-size:21px; font-weight:600; color:var(--ink); margin-top:8px}
.lk-d{font-size:12px; color:var(--mute); margin-top:5px}
.patternpad{position:relative; width:224px; height:224px; margin:20px auto 4px; touch-action:none}
.plines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.pdot{position:absolute; width:16px; height:16px; border-radius:50%; background:var(--accent-soft); transform:translate(-50%,-50%); transition:box-shadow .1s}
.pdot.on{background:var(--accent-deep); box-shadow:0 0 0 6px var(--accent-bg)}
.lk-hint{font-size:11px; color:var(--mute); min-height:16px; margin-top:8px}
.lk-hint.err{color:var(--warn); font-weight:700}
.lk-alt{font-size:12px; color:var(--accent-deep); font-weight:700; margin-top:14px; cursor:pointer; text-decoration:underline}

/* ════════ 무료 진단 (바이럴 4종) ════════ */
/* 홈 발견 영역 */
.dgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dtile{background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:10px 10px 10px 12px; position:relative; overflow:hidden; cursor:pointer; box-shadow:var(--shadow-sm); display:grid; grid-template-columns:auto 1fr; grid-template-areas:"ic nm" "ic tg"; align-items:center; column-gap:9px; row-gap:4px; min-height:0}
.dtile:active{transform:scale(.985)}
.dtile::before{content:''; position:absolute; top:0; left:0; width:100%; height:4px; background:var(--dc,var(--accent))}
.dtile .dic{grid-area:ic; width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--dic-bg,var(--accent-bg)); box-shadow:var(--shadow-sm)}
.dtile .dnm{grid-area:nm; align-self:end; font-size:11px; font-weight:800; color:var(--ink); letter-spacing:-.03em; white-space:nowrap}
.dtile .dhook{display:none}
.dtile .dtag{grid-area:tg; align-self:start; justify-self:start; font-size:8.5px; font-weight:800; letter-spacing:.01em; color:var(--accent-deep); background:var(--accent-bg); border:1px solid var(--accent-soft); padding:3px 8px; border-radius:100px}

/* 허브 상단 인트로 */
.dx-intro{background:linear-gradient(135deg,var(--accent-bg),var(--bg-card)); border:1px solid var(--accent-soft); border-radius:15px; padding:15px 16px; margin-bottom:14px; flex-shrink:0}
.dx-intro .dx-t{font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-.01em}
.dx-intro .dx-d{font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.55; font-weight:500}

.vcard{background:var(--bg-card); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:13px; flex-shrink:0}

.vc-hero .vc-unit{font-size:14px; font-weight:700; color:var(--ink-soft)}
.vc-sub{font-size:11.5px; color:var(--ink-soft); line-height:1.55; margin-top:8px; font-weight:500}
.vc-badge{display:inline-block; margin-top:10px; font-size:10px; font-weight:800; color:var(--accent-deep); background:var(--accent-bg); border:1px solid var(--accent-soft); padding:5px 11px; border-radius:100px}
.vc-badge.warn{color:var(--warn); background:var(--warn-bg); border-color:#E8C8AB}
.vc-meter{margin-top:13px}

/* ════════════════════════════════════════════
   RESPONSIVE / ADAPTIVE (added) — 모바일 풀스크린 · 태블릿 컬럼 · 데스크톱 사이드바
   ════════════════════════════════════════════ */
html,body{background:#EDEAE3}
body{padding:0; min-height:100dvh; display:block; overscroll-behavior:none}
.phone{width:100%; max-width:none; height:100vh; height:100dvh; border-radius:0; box-shadow:none; flex-shrink:1}
.phone::before{display:none}
.screen{border-radius:0}
.statusbar{display:none !important}              /* 가짜 폰 상태바 제거(실 운영) */
.body{overscroll-behavior:contain}
.appheader{padding-top:max(15px, env(safe-area-inset-top))}
.nav{padding-bottom:calc(12px + env(safe-area-inset-bottom)); height:auto; min-height:66px}
.navbrand{display:none}

/* ── 화면이 넓어도 모바일 앱을 폰 프레임으로 가운데 정렬 (PC 전용 레이아웃 사용 안 함) ── */
@media (min-width:600px){
  html,body{background:radial-gradient(ellipse at 50% 0%, #ECEAE4 0%, #DAD7CE 55%, #CDC9BE 100%)}
  body{display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:24px 16px}
  .phone{width:430px; max-width:430px; height:min(920px, calc(100dvh - 48px)); border-radius:34px; box-shadow:0 30px 80px rgba(40,32,24,.24); overflow:hidden; flex-shrink:0}
  .screen{border-radius:34px}
}

/* ── 태블릿: 풀블리드 + 본문 가운데 컬럼 ── */
@media (min-width:700px) and (max-width:100000px){
  .body{max-width:700px; margin-left:auto; margin-right:auto; padding:22px 22px 30px}
  .appheader{padding-left:24px; padding-right:24px}
  .view .body, #mtBody, #hsBody{max-width:700px; margin-left:auto; margin-right:auto}
}

/* ── 데스크톱: 하단 탭바 → 왼쪽 사이드바, 콘텐츠는 가운데 컬럼 ── */
@media (min-width:100000px){
  .screen{flex-direction:row; align-items:stretch}
  .viewport{flex:1; min-width:0}
  .appheader{padding-top:18px; padding-left:36px; padding-right:36px}
  .nav{
    order:-1; position:static; width:264px; flex-shrink:0; height:auto; min-height:0;
    flex-direction:column; justify-content:flex-start; align-items:stretch; gap:3px;
    border-top:none; border-right:1px solid var(--accent-soft); background:var(--header-bg);
    padding:24px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .navbrand{display:block; padding:4px 14px 18px; line-height:1.25}
  .navbrand .lab{display:block; font-size:8.5px; letter-spacing:.3em; color:var(--accent-deep); text-transform:uppercase; font-weight:800; margin-bottom:5px}
  .navbrand .nm{font-family:var(--serif-h); font-size:19px; font-weight:600; color:var(--ink)}
  .navbrand .nm em{font-style:italic; color:var(--accent-deep)}
  .navbrand{position:relative}
  .navbrand::after{content:''; display:block; height:3px; width:52px; margin-top:11px; border-radius:3px; background:linear-gradient(90deg,#43302A,#8B6F3F 60%,#DCC394)}
  .nav .ni{
    flex:0 0 auto; flex-direction:row; justify-content:flex-start; align-items:center; gap:13px;
    width:100%; padding:12px 15px; border-radius:12px; font-size:14px; color:var(--ink-soft);
    transition:background .15s;
  }
  .nav .ni .nic{font-size:20px}
  .nav .ni.on{color:var(--accent-deep); background:var(--accent-bg)}
  .nav .ni:hover{background:var(--accent-bg)}
  /* (사이드바를 flex 형제로 배치 → .view 오프셋 불필요) */
  /* 헤더를 대시보드 폭에 정렬 (홈 헤더만) */
  .view-home .appheader{max-width:1040px; margin-left:auto; margin-right:auto; width:100%; box-sizing:border-box; padding-left:24px; padding-right:24px}
  /* 홈: 2단 대시보드 — 섹션 라벨은 전폭, 카드는 2열 */
  .view-home .body{
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px; align-items:start;
    max-width:1040px; margin-left:auto; margin-right:auto; padding:24px 24px 48px;
  }
  .view-home .body > .seclabel{grid-column:1 / -1; margin-top:4px}
  /* 개별 화면(뷰)·테스트: 가운데 단일 컬럼 */
  .view:not(.view-home) .body, #mtBody, #hsBody{max-width:740px; margin-left:auto; margin-right:auto}
}

/* ── 와이드 데스크톱: 대시보드 조금 더 넓게 ── */
@media (min-width:100000px){
  .view-home .appheader, .view-home .body{max-width:1180px}
  .view-home .appheader{border:1.5px solid var(--accent-soft); border-radius:20px; margin-top:14px; margin-bottom:2px; box-shadow:0 14px 32px -16px rgba(58,39,31,.5)}
}
/* ════════════════════════════════════════════
   데스크톱 전용 대시보드 (.deskhome) — 모바일 미적용
   ════════════════════════════════════════════ */
.deskhome{display:none}
@keyframes dhRise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@media (min-width:100000px){
  .view-home > .body{display:none}              /* PC: 모바일 홈 본문 숨김 */
  .view-home > .appheader{max-width:1240px}     /* 헤더 폭 살짝 축소 — 골드 라운드 카드형 */
  .deskhome{display:block; flex:1; min-height:0; overflow-y:auto; padding:8px 32px 46px}
  .deskhome .dh-grid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:24px; align-items:start; max-width:1380px; margin:0 auto}
  .deskhome .dh-main{min-width:0}

  .deskhome .dh-sec{display:flex; align-items:baseline; gap:11px; margin:26px 2px 14px}
  .deskhome .dh-sec h2{font-family:var(--serif-h); font-size:20px; font-weight:600; color:var(--ink)}
  .deskhome .dh-sec .en{font-size:10px; letter-spacing:.2em; color:var(--accent-deep); font-weight:800; text-transform:uppercase}
  .deskhome .dh-sec .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--accent-soft),transparent)}

  .deskhome .dh-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
  .deskhome .dh-kpi{background:var(--bg-card); border:1px solid var(--line); border-radius:18px; padding:17px 17px 15px; position:relative; overflow:hidden; box-shadow:0 8px 22px -14px rgba(20,24,36,.18); animation:dhRise .5s cubic-bezier(.2,.7,.3,1) both}
  .deskhome .dh-kpi::after{content:''; position:absolute; left:0; top:0; width:100%; height:3px; background:var(--kc)}
  .deskhome .dh-kpi .kt{display:flex; align-items:center; justify-content:space-between}
  .deskhome .dh-kpi .kl{font-size:12px; color:var(--mute); font-weight:600}
  .deskhome .dh-kpi .ki{font-size:15px}
  .deskhome .dh-kpi .kv{font-family:var(--serif-h); font-size:29px; font-weight:600; color:var(--ink); margin-top:8px; line-height:1}
  .deskhome .dh-kpi .kv small{font-size:14px; color:var(--ink-soft); margin-left:1px}
  .deskhome .dh-kpi .ks{font-size:11.5px; margin-top:7px; font-weight:600}

/* ===== 자산금고(finance) CSS — #viewVault 스코프 ===== */

  --bg:#F7F8FA;--bg-warm:#F0F1F5;--bg-card:#FFFFFF;
  --gold:#C9A96E;--gold-lt:#F5EFE0;--gold-dk:#A68B4B;
  --accent:#1B3A6B;--accent-lt:#E8EDF5;--accent-bright:#2D5DAE;

  --red:#C0392B;--red-lt:#FBEAE8;

  var ax=[['so',Math.max(c.M,c.N),so],['pl',Math.max(c.P,c.I),pl],['ri',Math.max(c.S,c.R),ri],['mi',Math.max(c.V,c.L),mi]].sort((a,b)=>b[1]-a[1]);

  var inv={

  };

function vEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function vrow(n,a,u){ u=u||'만원'; return '<div class="vrow"><input class="vname" value="'+vEsc(n)+'" placeholder="항목명"><div class="vamtwrap"><input class="vamt" inputmode="numeric" value="'+vEsc(a)+'" placeholder="0" oninput="vaultRecalc()"><span class="vunit">'+u+'</span></div><span class="vdel" onclick="vaultDel(this)">×</span></div>'; }
function vSetTxt(id,t){ var e=document.getElementById(id); if(e) e.textContent=t; }
function vMan(m){ m=Math.round(m); if(!m) return '0'; var eok=Math.floor(m/10000), r=m%10000; if(eok>0) return eok+'억'+(r?(' '+r.toLocaleString()+'만'):''); return m.toLocaleString()+'만'; }
function vSum(id){ var t=0, els=document.querySelectorAll('#'+id+' .vamt'); for(var i=0;i<els.length;i++){ var v=parseFloat((els[i].value||'').replace(/[^0-9.]/g,'')); if(!isNaN(v)) t+=v; } return t; }
function vaultRecalc(){ var re=vSum('grpAsset'), fin=vSum('grpFin'), a=re+fin, d=vSum('grpDebt'); vSetTxt('vTotAsset',vMan(a)); vSetTxt('vTotDebt',vMan(d)); vSetTxt('vNet',vMan(a-d)); vSetTxt('vInsSum',vMan(vSum('grpIns'))+'만원/월'); vaultComp(re,fin,a,d); }
function vaultComp(re,fin,a,d){ var bRe=document.getElementById('vBarRe'); if(!bRe) return; var pRe=a>0?Math.round(re/a*100):0, pFin=a>0?100-pRe:0; bRe.style.width=pRe+'%'; var bFin=document.getElementById('vBarFin'); if(bFin) bFin.style.width=pFin+'%'; vSetTxt('vPctRe',pRe+'%'); vSetTxt('vPctFin',pFin+'%'); vSetTxt('vDebtRatio',(a>0?Math.round(d/a*100):0)+'%'); }
function vaultAddRow(id){ var c=document.getElementById(id); if(!c) return; var u=id==='grpIns'?'월':'만원'; var d=document.createElement('div'); d.className='vrow'; d.innerHTML='<input class="vname" placeholder="항목명"><div class="vamtwrap"><input class="vamt" inputmode="numeric" placeholder="0" oninput="vaultRecalc()"><span class="vunit">'+u+'</span></div><span class="vdel" onclick="vaultDel(this)">×</span>'; c.appendChild(d); var ni=d.querySelector('.vname'); if(ni) ni.focus(); }
function vaultDel(el){ var r=el.closest('.vrow'); if(r){ r.parentNode.removeChild(r); vaultRecalc(); } }
function vaultGrps(){ return ['grpAsset','grpFin','grpIns','grpDebt']; }
function vaultCollect(){ var o={}; vaultGrps().forEach(function(id){ o[id]=[]; document.querySelectorAll('#'+id+' .vrow').forEach(function(r){ o[id].push({n:r.querySelector('.vname').value, a:r.querySelector('.vamt').value}); }); }); return o; }
function vaultApply(o){ vaultGrps().forEach(function(id){ var c=document.getElementById(id); if(!c||!o[id]) return; var u=id==='grpIns'?'월':'만원', h=''; o[id].forEach(function(x){ h+=vrow(x.n,x.a,u); }); c.innerHTML=h; }); }
function _ls(){ try{ var s=window['local'+'Storage']; var k='__ss_test'; s.setItem(k,'1'); s.removeItem(k); return s; }catch(e){ return null; } }
function vaultSave(){ var s=_ls(); if(!s){ showToast('미리보기에선 저장이 막혀요 · 실제 사이트에선 저장됩니다'); return; } try{ s.setItem('secretsafe_vault_v1', JSON.stringify(vaultCollect())); showToast('✓ 이 기기에 저장되었습니다'); }catch(e){ showToast('저장 중 오류가 났어요'); } }
function vaultLoad(msg){ var s=_ls(); if(s){ try{ var raw=s.getItem('secretsafe_vault_v1'); if(raw){ vaultApply(JSON.parse(raw)); if(msg) showToast('✓ 저장본을 불러왔어요'); } else if(msg){ showToast('아직 저장된 내용이 없어요'); } }catch(e){} } vaultRecalc(); }

function lcDisc(){ var p=parseFloat(gv('dcP').replace(/[^0-9.]/g,'')), r=parseFloat(gv('dcR').replace(/[^0-9.]/g,'')); var o=document.getElementById('dcOut'); if(o) o.textContent=(p>0&&!isNaN(r))?Math.round(p*(1-r/100)).toLocaleString()+'원':'—'; }
function lcAge(){ var v=gv('agB'); var o=document.getElementById('agOut'); if(!v){ if(o) o.textContent='—'; return; } var b=new Date(v), t=new Date(); var age=t.getFullYear()-b.getFullYear(), m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate())) age--; if(o) o.textContent=(age>=0?age+'세':'—'); }

 INTJ:{nm:'전략가',d:'독립적이고 치밀한 장기 계획가',full:'머릿속에 늘 장기 계획이 돌아가는 전략가예요. 비효율을 견디지 못하고, 목표가 정해지면 조용하지만 끈질기게 밀어붙입니다. 혼자 사고하는 시간에서 에너지를 얻습니다.',s:'통찰력 · 장기 전략 · 독립성 · 높은 기준',w:'감정 표현이 서툴고, 자기 방식을 고집하거나 남의 비효율에 답답해할 수 있어요.',love:'표현은 적지만 한번 마음먹으면 진지하고 헌신적. 깊은 대화와 지적 교감을 중요하게 여겨요.',work:'큰 그림을 설계하고 시스템을 개선하는 일에 강해요. 자율성이 보장될 때 최고의 성과를 냅니다.',best:'ENFP · ENTP'},

 ENTJ:{nm:'통솔자',d:'결과를 만들어내는 타고난 리더',full:'목표를 세우고 사람과 자원을 움직여 결과를 만들어내는 타고난 리더예요. 결단이 빠르고 추진력이 강하며, 비효율과 우유부단함을 답답해합니다.',s:'리더십 · 결단력 · 전략 · 추진력',w:'때로 강압적으로 보이고, 타인의 감정이나 속도를 배려하지 못할 수 있어요.',love:'주도적이고 헌신적. 함께 성장하는 관계를 원하고, 목표와 비전을 공유하는 상대를 선호해요.',work:'조직을 이끌고 큰 프로젝트를 굴리는 일에 최적. 권한과 도전이 주어질 때 빛납니다.',best:'INTP · INFP'},
 ENTP:{nm:'변론가',d:'토론을 즐기는 재기발랄한 발명가',full:'새로운 아이디어와 토론을 즐기는 재기발랄한 발명가예요. 기존의 틀에 도전하고 가능성을 탐색하는 데 능하지만, 흥미가 식으면 쉽게 다음으로 넘어갑니다.',s:'순발력 · 창의력 · 언변 · 적응력',w:'마무리가 약하고, 논쟁을 즐기다 상대를 지치게 할 수 있어요.',love:'유쾌하고 자극을 주는 연애를 좋아해요. 지루함을 싫어하고, 함께 새로운 걸 시도하는 관계를 원합니다.',work:'기획·창업·마케팅처럼 아이디어와 변화가 많은 일에 강해요. 정해진 루틴은 답답해합니다.',best:'INFJ · INTJ'},
 INFJ:{nm:'옹호자',d:'신념으로 사람을 돕는 조용한 이상가',full:'깊은 통찰과 확고한 가치관으로 사람을 돕고자 하는 조용한 이상가예요. 겉은 부드럽지만 내면엔 강한 신념이 있고, 의미 있는 소수와 깊게 연결되길 원합니다.',s:'공감 · 통찰 · 헌신 · 진정성',w:'너무 많이 짊어지다 번아웃되기 쉽고, 완벽주의와 자기 비판이 강해요.',love:'깊고 진실한 연결을 추구해요. 가벼운 관계보다 영혼이 통하는 한 사람을 원합니다.',work:'상담·교육·기획처럼 사람과 의미를 다루는 일에 강해요. 가치와 맞지 않으면 버티기 힘들어합니다.',best:'ENFP · ENTP'},
 INFP:{nm:'중재자',d:'가치와 진심을 중시하는 따뜻한 몽상가',full:'자신만의 가치와 진심을 가장 소중히 여기는 따뜻한 몽상가예요. 이상을 품고 살아가며, 조용하지만 신념이 건드려지면 누구보다 단단해집니다.',s:'공감 · 창의성 · 진정성 · 이상 추구',w:'현실적 실행이 약하고, 자기 비판이 심하거나 갈등을 회피하려 해요.',love:'진심과 이해를 가장 중시해요. 운명 같은 깊은 사랑을 꿈꾸고, 상대가 내면을 봐주길 바랍니다.',work:'글·예술·상담처럼 가치와 표현이 담긴 일에 강해요. 경쟁적이고 메마른 환경은 힘들어합니다.',best:'ENFJ · ENTJ'},
 ENFJ:{nm:'선도자',d:'잠재력을 끌어내는 따뜻한 리더',full:'사람의 잠재력을 알아보고 끌어내는 따뜻한 리더예요. 분위기를 살리고 모두를 챙기며, 타인의 성장과 화합에서 큰 보람을 느낍니다.',s:'공감 · 소통 · 동기부여 · 리더십',w:'남을 챙기느라 자기를 희생하고, 갈등이나 비판에 예민해요.',love:'헌신적이고 다정해요. 상대를 살뜰히 챙기지만, 인정과 사랑을 충분히 돌려받고 싶어합니다.',work:'교육·HR·팀 리딩처럼 사람을 이끌고 돕는 일에 강해요. 사람 중심 조직에서 빛납니다.',best:'INFP · ISFP'},
 ENFP:{nm:'활동가',d:'가능성을 사랑하는 자유로운 열정가',full:'가능성과 사람을 사랑하는 자유로운 열정가예요. 호기심이 넘치고 어디서든 활력을 불어넣지만, 흥미가 식거나 반복되면 금세 지루해합니다.',s:'열정 · 창의 · 친화력 · 긍정 에너지',w:'집중과 루틴 유지가 약하고, 벌여놓고 마무리를 못 할 때가 있어요.',love:'설렘과 깊은 교감을 동시에 원해요. 함께 새로운 걸 경험하고 마음을 깊이 나누는 관계를 좋아합니다.',work:'기획·홍보·창작처럼 사람과 아이디어가 오가는 일에 강해요. 자유와 다양성이 있을 때 최고예요.',best:'INTJ · INFJ'},
 ISTJ:{nm:'현실주의자',d:'원칙을 지키는 신뢰의 실무가',full:'책임감과 원칙으로 묵묵히 일을 해내는 신뢰의 실무가예요. 약속을 지키고 절차를 중시하며, 검증된 방식을 선호합니다.',s:'성실 · 책임감 · 꼼꼼함 · 신뢰성',w:'변화와 즉흥에 약하고, 융통성이나 감정 표현이 부족해 보일 수 있어요.',love:'말보다 행동으로 보여주는 든든한 스타일. 안정적이고 한결같은 관계를 추구해요.',work:'회계·관리·행정처럼 정확성과 책임이 필요한 일에 강해요. 체계가 잡힌 환경을 선호합니다.',best:'ESFP · ESTP'},
 ISFJ:{nm:'수호자',d:'헌신적으로 돌보는 따뜻한 조력자',full:'조용히 헌신하며 주변을 돌보는 따뜻한 조력자예요. 세심하게 챙기고 책임을 다하며, 익숙함과 안정 속에서 편안함을 느낍니다.',s:'배려 · 헌신 · 책임감 · 꼼꼼함',w:'거절을 못 하고 자기 의견을 잘 못 내며, 속으로 서운함을 쌓아두기 쉬워요.',love:'헌신적이고 다정해요. 상대를 살뜰히 챙기지만 자신의 마음은 표현이 서툴 수 있습니다.',work:'간호·교육·총무처럼 사람을 돕고 챙기는 일에 강해요. 안정적이고 따뜻한 분위기에서 빛납니다.',best:'ESFP · ESTP'},
 ESTJ:{nm:'경영자',d:'질서와 효율의 관리형 리더',full:'질서와 효율로 일을 추진하는 관리형 리더예요. 명확한 기준과 절차를 세우고 책임감 있게 결과를 만들어냅니다.',s:'조직력 · 추진력 · 책임감 · 실행력',w:'융통성이 부족하고, 감정보다 결과를 앞세워 차갑게 느껴질 수 있어요.',love:'책임감 있고 든든해요. 분명한 관계와 약속을 중시하고, 가정과 일상을 안정적으로 꾸려갑니다.',work:'운영·관리·리더 역할에 최적. 목표와 규칙이 분명한 조직에서 강합니다.',best:'ISFP · ISTP'},
 ESFJ:{nm:'집정관',d:'분위기를 살리는 사교적 조력자',full:'사람을 챙기고 분위기를 살리는 사교적 조력자예요. 주변의 필요를 잘 알아채고, 모두가 어울리도록 다리를 놓습니다.',s:'친화력 · 배려 · 협력 · 책임감',w:'비판에 예민하고 인정 욕구가 커서, 남의 평가에 흔들릴 수 있어요.',love:'다정하고 헌신적. 함께하는 시간과 표현을 중시하고, 안정적이고 따뜻한 관계를 원해요.',work:'서비스·HR·영업처럼 사람을 대하는 일에 강해요. 협력적이고 화목한 팀에서 빛납니다.',best:'ISFP · ISTP'},
 ISTP:{nm:'장인',d:'손으로 문제를 푸는 과묵한 해결사',full:'말보다 손으로 문제를 푸는 과묵한 해결사예요. 위기에도 침착하고, 직접 만지고 분해하며 원리를 터득합니다.',s:'실용성 · 침착함 · 기술력 · 문제해결',w:'감정 표현과 장기 계획이 약하고, 얽매이는 걸 싫어해요.',love:'담백하고 쿨한 스타일. 말은 적지만 행동으로 챙기고, 적당한 거리와 자유를 중요하게 여겨요.',work:'엔지니어링·정비·현장처럼 손과 기술을 쓰는 일에 강해요. 자율적인 환경을 선호합니다.',best:'ESFJ · ESTJ'},
 ISFP:{nm:'모험가',d:'감각과 자유를 사랑하는 온화한 예술가',full:'감각과 자유를 사랑하는 온화한 예술가예요. 경쟁보다 조화를 좋아하고, 지금 이 순간의 아름다움과 느낌을 소중히 합니다.',s:'감성 · 유연함 · 배려 · 심미안',w:'결정과 자기주장이 약하고, 갈등을 피하려다 속을 감추기 쉬워요.',love:'다정하고 헌신적이지만 표현은 은은해요. 자유를 존중해주는 편안한 관계를 원합니다.',work:'디자인·예술·돌봄처럼 감각과 마음을 쓰는 일에 강해요. 압박이 적은 환경에서 빛납니다.',best:'ENFJ · ESFJ'},
 ESTP:{nm:'사업가',d:'부딪혀 해결하는 행동파 승부사',full:'지금 이 순간을 즐기며 부딪혀 해결하는 행동파 승부사예요. 현실 감각이 뛰어나고, 위기에서 오히려 빛을 발합니다.',s:'추진력 · 순발력 · 현실감각 · 대담함',w:'신중함과 인내가 부족하고, 즉흥적으로 일을 벌이기 쉬워요.',love:'적극적이고 화끈해요. 함께 즐기고 경험하는 연애를 좋아하고, 지루함을 못 견딥니다.',work:'영업·협상·현장처럼 빠른 판단과 행동이 필요한 일에 강해요. 변화 많은 환경을 즐깁니다.',best:'ISFJ · ISTJ'},
 ESFP:{nm:'연예인',d:'즐거움을 퍼뜨리는 분위기 메이커',full:'즐거움을 퍼뜨리는 분위기 메이커 사교가예요. 사람들과 어울리며 활력을 얻고, 지금의 순간을 누구보다 신나게 즐깁니다.',s:'친화력 · 활력 · 현실감각 · 낙천성',w:'계획과 집중이 약하고, 진지한 주제나 장기 과제를 미루기 쉬워요.',love:'표현이 풍부하고 다정해요. 함께 즐기는 시간을 중시하고, 밝고 따뜻한 관계를 원합니다.',work:'서비스·이벤트·영업처럼 사람과 현장을 다루는 일에 강해요. 활기찬 분위기에서 빛납니다.',best:'ISFJ · ISTJ'}
};
var MBTI_GROUPS=[
 {t:'분석가 · NT',c:'#7B6299',list:['INTJ','INTP','ENTJ','ENTP']},
 {t:'외교관 · NF',c:'#6B8E6F',list:['INFJ','INFP','ENFJ','ENFP']},
 {t:'관리자 · SJ',c:'#5A7595',list:['ISTJ','ISFJ','ESTJ','ESFJ']},
 {t:'탐험가 · SP',c:'#C97755',list:['ISTP','ISFP','ESTP','ESFP']}
];
function mbtiGridHTML(){ var h=''; MBTI_GROUPS.forEach(function(g){ h+='<div class="seclabel">'+g.t+'</div><div class="mbti-grid">'; g.list.forEach(function(code){ h+='<div class="mbti-chip" style="--mc:'+g.c+'" onclick="mbtiShow(\''+code+'\')"><div class="mc-code">'+code+'</div><div class="mc-nm">'+MBTI[code].nm+'</div></div>'; }); h+='</div>'; }); return h; }
function mbtiOptions(){ var h=''; for(var k in MBTI){ h+='<option value="'+k+'">'+k+' · '+MBTI[k].nm+'</option>'; } return h; }

  return `
    <div class="statusbar"><span>9:41</span><span>●●● 100%</span></div>

        <div class="mm-row"><b>약점·주의</b><span id="mbtiWatch"></span></div>

function mbtiMatchHTML(){
  return `
    <div class="statusbar"><span>9:41</span><span>●●● 100%</span></div>
    <div class="appheader alerts-hdr"><span class="back-btn" onclick="hideView('viewMbtiMatch')">‹</span><span class="alerts-title">궁합 보기</span><div class="h-btn">💕</div></div>
    <div class="body">
      <div class="vault-hero"><div class="vh-h">💕 MBTI 궁합</div><div class="vh-d">내 유형과 친구 유형을 골라보세요.</div></div>

function mbtiMatch(){
  var a=gv('mbA'), b=gv('mbB'); var out=document.getElementById('mbResult'); if(!a||!b||!out) return;
  var score=50, pros=[], cons=[];
  if(a[0]!==b[0]){ score+=8; pros.push('에너지 방향이 달라(외향·내향) 서로 균형을 맞춰줘요'); } else { score+=4; }
  if(a[1]===b[1]){ score+=20; pros.push('세상을 비슷한 방식으로 봐서 대화가 잘 통해요'); } else { score-=5; cons.push('한쪽은 큰 그림, 한쪽은 현실·구체라 가끔 답답할 수 있어요'); }
  if(a[2]===b[2]){ score+=6; } else { score+=2; cons.push('결정할 때 한쪽은 논리, 한쪽은 감정이라 부딪힐 수 있어요'); }
  if(a[3]!==b[3]){ score+=10; pros.push('한쪽은 계획적, 한쪽은 즉흥적이라 서로를 채워줘요'); } else if(a[3]==='J'){ score+=6; cons.push('둘 다 계획형이라 서로 고집이 셀 수 있어요'); } else { score+=6; cons.push('둘 다 즉흥형이라 일이 미뤄지기 쉬워요'); }
  if(score>100) score=100; if(score<0) score=0;
  var emo=score>=80?'천생연분 💛':score>=65?'잘 맞는 사이 😊':score>=50?'무난한 궁합 🙂':'노력이 필요한 사이 🤔';
  var h='<div class="mb-res"><div class="mb-rscore">'+a+' × '+b+'</div><div class="mb-rbig">'+score+'점</div><div class="mb-remo">'+emo+'</div>';
  if(pros.length){ h+='<div class="mb-rsec"><b>잘 맞는 점</b>'; pros.forEach(function(p){ h+='<div>· '+p+'</div>'; }); h+='</div>'; }
  if(cons.length){ h+='<div class="mb-rsec"><b>주의할 점</b>'; cons.forEach(function(p){ h+='<div>· '+p+'</div>'; }); h+='</div>'; }
  h+='</div>'; out.innerHTML=h;
}

// 로직은 fc.html setupMorningCard와 동일 — morningBookzipUrl의 b값이 기준일 대비 매주 +1 자동 증가.
var SS_CONSULTANT_MORNING = { morningBookzipUrl:'https://www.bookzip.kr/00.asp?c=297&b=624', bookzipBaseDate:'2026-05-18', morningReadingUrl:'' };
function ssSetupMorning(){
  var a=document.getElementById('nhMorning'); if(!a) return;
  var cd=SS_CONSULTANT_MORNING||{}, url='';
  if(cd.morningBookzipUrl){
    url=cd.morningBookzipUrl;
    try{
      var u=new URL(url);
      var b=parseInt(u.searchParams.get('b')||'0');
      if(b>0 && cd.bookzipBaseDate){
        var base=new Date(cd.bookzipBaseDate+'T00:00:00+09:00');
        var weeks=Math.floor((new Date()-base)/(7*24*60*60*1000));
        u.searchParams.set('b', b+Math.max(0,weeks));
        url=u.toString();
      }
    }catch(e){}
  }
  if(!url && cd.morningReadingUrl) url=cd.morningReadingUrl;
  if(url){ a.href=url; a.target='_blank'; a.rel='noopener'; }
}

function ssCopy(text, okMsg){
  function ok(){ showToast(okMsg || '복사했어요'); }
  function fallback(){
    try{
      var ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.top='0'; ta.style.left='-9999px'; ta.setAttribute('readonly','');
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var done=document.execCommand('copy'); document.body.removeChild(ta);
      done ? ok() : showToast('복사 실패 — 주소를 길게 눌러 복사해 주세요');
    }catch(e){ showToast('복사 실패 — 주소를 길게 눌러 복사해 주세요'); }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); }
    else { fallback(); }
  }catch(e){ fallback(); }
}

function setupPattern(){
  var pad=document.getElementById('ppad'); if(!pad) return;
  var dots=[].slice.call(pad.querySelectorAll('.pdot'));
  var svg=document.getElementById('plines');
  var seq=[], drawing=false;
  function center(d){ var r=d.getBoundingClientRect(), pr=pad.getBoundingClientRect(); return {x:(r.left-pr.left+r.width/2)/pr.width*224, y:(r.top-pr.top+r.height/2)/pr.height*224}; }
  function pos(e){ var pr=pad.getBoundingClientRect(); return {x:(e.clientX-pr.left)/pr.width*224, y:(e.clientY-pr.top)/pr.height*224}; }
  function redraw(px,py){
    var d='';
    for(var k=0;k<seq.length;k++){ var c=center(dots[seq[k]]); d+=(k===0?'M':' L')+c.x.toFixed(1)+' '+c.y.toFixed(1); }
    if(seq.length && px!=null) d+=' L'+px.toFixed(1)+' '+py.toFixed(1);
    svg.innerHTML = d ? '<path d="'+d+'" style="fill:none;stroke:var(--accent-deep);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>' : '';
  }
  function hit(x,y){ for(var i=0;i<dots.length;i++){ if(seq.indexOf(i)>=0) continue; var c=center(dots[i]); var dx=x-c.x, dy=y-c.y; if(dx*dx+dy*dy < 24*24){ seq.push(i); dots[i].classList.add('on'); } } }
  pad.addEventListener('pointerdown', function(e){ e.preventDefault(); drawing=true; seq=[]; for(var i=0;i<dots.length;i++) dots[i].classList.remove('on'); var p=pos(e); hit(p.x,p.y); redraw(p.x,p.y); try{ pad.setPointerCapture(e.pointerId); }catch(x){} });
  pad.addEventListener('pointermove', function(e){ if(!drawing) return; var p=pos(e); hit(p.x,p.y); redraw(p.x,p.y); });
  function end(){ if(!drawing) return; drawing=false; redraw(null,null);
    var hint=document.getElementById('lkHint');
    if(seq.length>=4){ unlockPw(); }
    else { if(hint){ hint.textContent='4개 이상 점을 연결해 주세요'; hint.classList.add('err'); } setTimeout(function(){ seq=[]; for(var i=0;i<dots.length;i++) dots[i].classList.remove('on'); svg.innerHTML=''; if(hint){ hint.textContent=''; hint.classList.remove('err'); } },800); }
  }
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
}

/* PROD_KEY */
const PROD_KEY = ()=>'ss_vault_prods_v1';

/* loadProds */
function loadProds(){try{return JSON.parse(localStorage.getItem(PROD_KEY())||'{}');}catch{return {};}}

/* saveProds */
function saveProds(d){
  localStorage.setItem(PROD_KEY(),JSON.stringify(d));
  // Firestore 비동기 저장 (오류 무시)
  const sess = session||loadSess();
  if(sess?.clientId && fb()){
    fb().saveProducts(sess.clientId, d).catch(e=>
      console.warn('[saveProds Firestore]', e.message));
  }
}

/* getProds */
function getProds(cat){return (loadProds()[cat]||[]);}

/* addProd */
function addProd(cat,item){
  const d=loadProds(); if(!d[cat])d[cat]=[];
  item.id='p'+Date.now(); d[cat].push(item); saveProds(d);
}

/* delProd */
function delProd(cat,id){
  const d=loadProds(); if(!d[cat])return;
  d[cat]=d[cat].filter(p=>p.id!==id); saveProds(d);
}

/* updateProd */
function updateProd(cat,id,newData){
  const d=loadProds(); if(!d[cat])return;
  const idx=d[cat].findIndex(p=>p.id===id);
  if(idx>=0) d[cat][idx]={...d[cat][idx],...newData};
  saveProds(d);
}

/* ─── 금액 포맷 ─── */

/* fmtAmt */
function fmtAmt(v){
  if(!v||isNaN(v))return'0원';
  const a=Math.abs(v),s=v<0?'-':'';
  if(a>=100000000)return s+(a/1e8).toFixed(1).replace(/\.0$/,'')+'억원';
  if(a>=10000)return s+Math.round(a/1e4)+'만원';
  return s+a.toLocaleString()+'원';
}

/* numFmt */
function numFmt(el){
  let v=el.value.replace(/[^0-9]/g,'');
  el.dataset.raw=v;
  el.value=v?Number(v).toLocaleString('ko-KR'):'';
}

/* numRaw */
function numRaw(el){
  return Number((el.dataset.raw||el.value).replace(/[^0-9]/g,''))||0;
}

  if(sel.value!=='직접입력') return;
  const key=sel.dataset.key;
  const inp=document.createElement('input');
  inp.className='mfi'; inp.type='text';
  inp.dataset.key=key; inp.placeholder='직접 입력';
  inp.style.marginTop='6px';
  sel.parentNode.appendChild(inp);
  sel.style.display='none';

/* fmtDate */
function fmtDate(d){

}

/* 기본 정보 렌더링 */

/* calcScores */
function calcScores(){
  const ins  = getProds('insurance');
  const sav  = getProds('savings');
  const inv  = getProds('invest');
  const ret  = getProds('retire');
  const loan = getProds('loan');
  const car  = getProds('car');
  const re   = getProds('realestate'); // 부동산

  /* ── 자산 집계 ── */
  const totalPrem   = ins.reduce((s,p)=>s+n(p.premium),0);
  const totalSavBal = sav.reduce((s,p)=>s+n(p.balance),0);
  const totalInvBal = inv.reduce((s,p)=>s+n(p.balance),0);
  const totalRetBal = ret.reduce((s,p)=>s+n(p.balance),0);
  const totalDebt   = loan.reduce((s,p)=>s+n(p.balance),0);
  const totalRepay  = loan.reduce((s,p)=>s+n(p.monthly),0);
  const totalCarPay = car.reduce((s,p)=>s+n(p.monthly),0);
  const carInsYear  = car.reduce((s,p)=>s+(p.insPayType==='monthly'?n(p.insAmount)*12:n(p.insAmount)),0);
  const monthlySav  = sav.reduce((s,p)=>s+n(p.monthly),0);
  const monthlyInv  = inv.reduce((s,p)=>s+(n(p.monthly)||n(p.yearly)/12),0);
  // 부동산 월세 합계
  const monthlyRent = re.reduce((s,p)=>s+n(p.monthlyRent),0);
  // 연금 월납입 (국민연금은 이미 월납부액이므로 /12 하지 않음)
  const monthlyRet  = ret.reduce((s,p)=>{
    const v = n(p.monthly||p.yearly);
    return s + (p.type==='국민연금' ? v : v/12);
  },0);
  // 부동산 순자산 (현재시세 - 담보대출)
  const totalRePrice= re.reduce((s,p)=>s+n(p.currentPrice||p.buyPrice),0);
  const totalReMtg  = re.reduce((s,p)=>s+n(p.mortgage),0);
  const reNetAsset  = Math.max(totalRePrice - totalReMtg, 0);
  // 전체 자산 (금융 + 부동산 순자산)
  const totalAsset  = totalSavBal + totalInvBal + totalRetBal + reNetAsset;
  const netAsset    = totalAsset - totalDebt;
  // 월납입 합계 (연금 + 월세 + 자동차보험 포함)
  const monthlyOut  = totalPrem + monthlySav + totalRepay + totalCarPay + monthlyRet + monthlyRent + Math.round(carInsYear/12);

  /* ── 보험 상세 분석 ── */
  const hasReal   = ins.some(p=>p.type==='실손보험');
  const hasCancer = ins.some(p=>p.type==='암보험');
  const hasLife   = ins.some(p=>p.type==='종신·정기보험');
  const hasPension= ins.some(p=>p.type==='연금보험');
  const hasDementia=ins.some(p=>p.type==='치매보험');
  // 3대 진단비 합산
  // 진단비: 타입 무관 모든 보험에서 합산 (특약 포함)
  const cancerAmt = ins.reduce((s,p)=>s+n(p.cancerAmt),0);
  const brainAmt  = ins.reduce((s,p)=>s+n(p.brainAmt),0);
  const heartAmt  = ins.reduce((s,p)=>s+n(p.heartAmt),0);
  const diagTotal = cancerAmt + brainAmt + heartAmt;
  // 입원일당 합산
  const hospDaily = ins.reduce((s,p)=>s+n(p.hospDaily),0);

  /* ── 1. 보장 점수 (100점) ── */
  let insScore = 0;
  if(hasReal)    insScore += 30;  // 실손: 필수 30점
  if(hasCancer)  insScore += 25;  // 암보험 25점
  if(hasLife)    insScore += 20;  // 종신·정기 20점
  if(hasPension) insScore += 10;  // 연금보험 10점
  if(hasDementia)insScore += 5;   // 치매보험 5점
  // 진단비 충분도 보너스 (암 3000만 이상 → +5, 5000만 이상 → +10)
  if(cancerAmt>=50000000) insScore += 10;
  else if(cancerAmt>=30000000) insScore += 5;
  insScore = Math.min(100, insScore);

  /* ── 2. 자산구조 점수 ── */
  let asScore = 40;
  if(totalAsset > 0) asScore = 50;
  if(totalSavBal > 0) asScore += 10;
  if(totalInvBal > 0) asScore += 15;
  if(totalRetBal > 0) asScore += 20;
  if(reNetAsset  > 0) asScore += 5;  // 부동산 순자산 보유 시 추가
  const assetCats = [totalSavBal,totalInvBal,totalRetBal,reNetAsset].filter(v=>v>0).length;
  if(assetCats >= 3) asScore += 5;
  asScore = Math.min(100, asScore);

  /* ── 3. 부채 점수 ── */
  let debtScore = 100;
  if(totalDebt > 0){
    const ltv = totalDebt / (totalAsset || 1);
    if(ltv > 1.5) debtScore = 10;
    else if(ltv > 1)  debtScore = 25;
    else if(ltv > 0.7)debtScore = 45;
    else if(ltv > 0.5)debtScore = 60;
    else if(ltv > 0.3)debtScore = 75;
    else debtScore = 90;
    // DSR 고려 (월 상환 / 월 지출)
    if(monthlyOut > 0 && totalRepay / monthlyOut > 0.5) debtScore -= 10;
  }
  debtScore = Math.max(0, debtScore);

  /* ── 4. 노후 준비 점수 ── */
  let retScore = 20;
  if(totalRetBal > 0){
    // 1억당 20점, 최대 80점 + 기본 20점
    retScore = Math.min(80, Math.round(totalRetBal / 100000000 * 20)) + 20;
  }
  // 퇴직연금 있으면 +10
  if(ret.some(p=>p.type==='DB형 퇴직연금'||p.type==='DC형 퇴직연금')) retScore += 10;
  retScore = Math.min(100, retScore);

  /* ── 5. 현금흐름 점수 ── */
  let cfScore = 50;
  if(monthlySav > 0 || monthlyInv > 0 || monthlyRet > 0){
    // 저축·투자·연금 모두 포함
    const totalMonthlyInvest = monthlySav + monthlyInv + monthlyRet;
    cfScore = Math.min(100, 50 + Math.round(totalMonthlyInvest / 200000 * 5));
  }
  // 부채 상환 부담 높으면 감점
  if(totalRepay > 0 && (monthlySav + monthlyRet) > 0) {
    if(totalRepay > (monthlySav + monthlyRet) * 2) cfScore -= 15;
  }
  cfScore = Math.max(20, cfScore);

  const total = Math.round((insScore + asScore + debtScore + retScore + cfScore) / 5);

  return {
    total, insurance:insScore, assets:asScore, debt:debtScore,
    retirement:retScore, cashflow:cfScore,
    totalAsset, netAsset, totalDebt,
    totalSavBal, totalInvBal, totalRetBal,
    totalRePrice, reNetAsset,   // 부동산 시세·순자산
    totalPrem, monthlySav, totalRepay, monthlyOut,
    monthlyRet,                 // 연금 월납입
    hasReal, hasCancer, hasLife, hasPension, hasDementia,
    cancerAmt, brainAmt, heartAmt, diagTotal, hospDaily,
    assetCats,
    // 월별 납입 현황
    monthlySplit:{
      insurance: totalPrem,
      savings: monthlySav,
      loan: totalRepay,
      car: totalCarPay + Math.round(carInsYear/12),
      retire: Math.round(monthlyRet),
      rent: monthlyRent,
    }
  };
}

    {l:'심장 진단비',val:sc.heartAmt,rec:20000000},
    {l:'종신·정기보험',ok:sc.hasLife},

    let badge='';

      else badge=`<span class="dash-insure-badge dib-no">미가입</span>`;
    } else {

               :`<span class="dash-insure-badge dib-no">미가입</span>`;
    }
    return `<div class="dash-insure-row">
      <span class="dash-insure-lbl">${r.l}</span>${badge}</div>`;
  }).join('');

  // ── 카테고리별 ──
  const catData=[
    {ico:'🛡️',l:'보험',v:ins.length+'건',sub:sc.totalPrem>0?fa(sc.totalPrem)+'/월':''},
    {ico:'🏦',l:'저축',v:fa(sc.totalSavBal),sub:sc.monthlySav>0?fa(sc.monthlySav)+'/월':''},
    {ico:'📈',l:'투자',v:fa(sc.totalInvBal),sub:''},

    {ico:'📉',l:'대출',v:fa(sc.totalDebt),sub:sc.totalRepay>0?fa(sc.totalRepay)+'/월':'',debt:sc.totalDebt>0},

    {ico:'🧓',l:'노후준비',v:sc.retirement},
  ];
  const scoreColor=v=>v>=80?'var(--green)':v>=65?'var(--gold)':v>=50?'#F59E0B':'var(--red)';

  const peerEl=document.getElementById('peerBody');
  peerEl.innerHTML=scoreItems.map(it=>`
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:5px">
          <span>${it.ico}</span>${it.l}
        </span>
        <span style="font-size:14px;font-weight:800;color:${scoreColor(it.v)};font-family:var(--font-d)">${it.v}점</span>
      </div>
      <div style="height:8px;background:var(--bg-warm);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${it.v}%;background:${scoreColor(it.v)};border-radius:4px;transition:width .6s var(--ease)"></div>
      </div>
    </div>`).join('');

  /* ── 또래 비교 — 실제 나이 계산 ── */
  const _sess = session||loadSess();
  let _ageLabel = '--대';
  if(_sess?.birth){
    const _by = new Date(_sess.birth).getFullYear();
    const _age = new Date().getFullYear() - _by;
    _ageLabel = Math.floor(_age/10)*10 + '대';
  }
  document.getElementById('peerAge').textContent=_ageLabel;
  // peer 영역은 점수 카드로 대체 (peerBody 재사용)

  /* ── 만기 임박 알림 ── */
  const now=new Date();
  const thisYM=now.getFullYear()+'-'+String(now.getMonth()+2).padStart(2,'0');
  const nextYM=now.getFullYear()+'-'+String(now.getMonth()+4).padStart(2,'0');
  const savProds=getProds('savings');
  const expiring=savProds.filter(p=>p.maturity && p.maturity>=thisYM && p.maturity<=nextYM);
  if(expiring.length>0){
    const alerts=expiring.map(p=>`
      <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;
        background:#FEF3E2;border-radius:8px;margin-bottom:6px;
        border:1px solid rgba(252,211,77,.3)">
        <span style="font-size:15px">⏰</span>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--ink)">${p.company||''} ${p.type||''} 만기 임박</div>
          <div style="font-size:11px;color:var(--ink-lt)">${p.maturity} 만기 · ${fmtAmt(n(p.balance))}</div>
        </div>
      </div>`).join('');

    // 만기 섹션 추가 (peer 카드 아래)
    const pc=document.getElementById('peerBody');
    if(pc) pc.insertAdjacentHTML('afterend',
      `<div style="margin-top:12px">
        <div style="font-size:12px;font-weight:800;color:var(--ink-lt);margin-bottom:8px">⏰ 만기 임박</div>
        ${alerts}
      </div>`);
  }
}

/* renderProducts */
function renderProducts(){
  const grid=document.getElementById('prodCatGrid');
  grid.innerHTML=CATS.map(cat=>{
    const prods=getProds(cat.id);
    const cnt=prods.length;
    const monthly=prods.reduce((s,p)=>s+n(p.monthly||p.premium),0);
    return `<div class="prod-cat-card" onclick="openProdModal('${cat.id}')">
      ${cnt>0?`<div class="pcc-badge">${cnt}</div>`:''}
      <div class="pcc-icon">${cat.icon}</div>
      <div class="pcc-name">${cat.name}</div>
      <div class="pcc-count">${cnt>0?cnt+'개 등록':'미등록'}</div>
      ${monthly>0?`<div class="pcc-amount">${fmtAmt(monthly)}/월</div>`:''}
    </div>`;
  }).join('');
}

/* renderProdModal */
function renderProdModal(){
  const prods=getProds(curCat);
  const cat=CATS.find(c=>c.id===curCat);
  let html='';

  // 기존 상품 목록
  if(prods.length>0){
    html+=`<div class="prod-list-wrap">`;
    html+=prods.map(p=>`
      <div class="prod-list-item" onclick="showEditForm('${p.id}')" style="cursor:pointer">
        <span class="prod-list-icon">${cat.icon}</span>
        <div class="prod-list-info">
          <div class="prod-list-name">${p.name||p.company||'상품'}</div>
          <div class="prod-list-sub">${p.type||''} ${p.monthly||p.premium?'· '+fmtAmt(n(p.monthly||p.premium))+'/월':''}</div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="prod-list-del" style="background:var(--accent-lt);color:var(--accent-bright)"
            onclick="event.stopPropagation();showEditForm('${p.id}')">✏️</button>
          <button class="prod-list-del" onclick="event.stopPropagation();deleteProd('${curCat}','${p.id}')">✕</button>
        </div>
      </div>`).join('');
    html+='</div>';
  }

  // 추가 버튼
  html+=`<button class="prod-add-btn" onclick="showAddForm()">+ ${cat.name} 추가하기</button>`;

  // 입력 폼 (숨겨진 상태)
  html+=`<div id="addFormWrap" style="display:none">
    <div style="background:var(--green-lt);border:1px solid rgba(10,123,97,.15);border-radius:10px;
      padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--green);text-align:center">
      😊 모르는 항목은 비워두셔도 괜찮아요. 나중에 언제든 수정할 수 있습니다.
    </div>
    ${buildForm(curCat)}</div>`;

  document.getElementById('prodModalBody').innerHTML=html;
  document.getElementById('prodSaveBtn').style.display='none';
}

/* showEditForm */
window.showEditForm=function(id){
  editId=id;
  const prods=getProds(curCat);
  const p=prods.find(x=>x.id===id);
  if(!p) return;
  // 폼 표시
  document.getElementById('addFormWrap').style.display='block';
  document.querySelector('.prod-add-btn').style.display='none';
  document.getElementById('prodSaveBtn').style.display='block';
  document.getElementById('prodSaveBtn').textContent='수정 완료 ✓';
  // 기존 값 채우기 (DOM 렌더 후)
  setTimeout(()=>{
    document.querySelectorAll('#addFormWrap [data-key]').forEach(el=>{
      const key=el.dataset.key;
      const val=p[key];
      if(val===undefined||val==='') return;
      if(el.tagName==='SELECT'){
        // 리스트에 없는 값이면 직접입력 처리
        const exists=Array.from(el.options).some(o=>o.value===val||o.text===val);
        if(exists){
          el.value=val;
        } else {
          // 직접입력 옵션 선택 후 input 생성
          const directOpt=Array.from(el.options).find(o=>o.text==='직접입력');
          if(directOpt){
            el.value='직접입력';
            handleDirectInput(el);
            // 생성된 input에 값 세팅
            setTimeout(()=>{
              const inp=el.parentNode.querySelector('input[data-key="'+key+'"]');
              if(inp) inp.value=val;
            },30);
          }
        }
        try{ if(el.onchange) el.onchange(); }catch(e){}
      } else if(el.tagName==='INPUT'){
        const strVal=String(val);
        // date 필드에 YYYY-MM 형식 호환 (기존 month 데이터 → date 변환)
        if(el.type==='date' && /^\d{4}-\d{2}$/.test(strVal)){
          el.value=strVal+'-01';
        // 숫자 콤마 포맷 (oninput 있고 순수 숫자)
        } else if(el.oninput && strVal.match(/^[0-9]+$/) && Number(val)>0){
          el.value=Number(val).toLocaleString('ko-KR');
          el.dataset.raw=strVal;
        } else {
          el.value=val;
          if(strVal.match(/^[0-9]+$/)) el.dataset.raw=strVal;
        }
      }
    });
    // shareAmt 복원
    document.querySelectorAll('#addFormWrap [data-bool]').forEach(el=>{
      const key=el.dataset.bool;
      const val=p[key];
      const isOn = val !== 'N';
      el.classList.toggle('on', isOn);
      el.classList.toggle('sw-on', isOn);
      const lbl=el.closest('.prv-toggle-ctrl')?.querySelector('.sw-lbl');
      if(lbl) lbl.textContent = isOn ? '공유 중' : '비공개';
    });
    bindCalc();
  },80);
};

/* saveProd */
window.saveProd=function(){
  const form=document.getElementById('addFormWrap');
  if(!form)return;
  const data={};
  form.querySelectorAll('[data-key]').forEach(el=>{
    // 숫자 필드는 raw값(콤마 없는) 저장
    const raw = el.dataset.raw;
    // SELECT는 value만, INPUT은 value (textContent 절대 사용 금지)
    if(el.tagName==='SELECT'){
      data[el.dataset.key] = el.value || '';
    } else {
      data[el.dataset.key] = raw !== undefined ? raw : (el.value||'');
    }
  });
  form.querySelectorAll('[data-bool]').forEach(el=>{
    data[el.dataset.bool]=el.classList.contains('sw-on')?'Y':'N';
  });
  // 부동산·자동차는 name/address 필드 사용 → 검증 완화
  const skipCheck=['realestate'];
  if(!skipCheck.includes(curCat) && !data.company&&!data.name){
    toast('회사명 또는 상품명을 입력해주세요','err');return;
  }
  if(editId){
    updateProd(curCat,editId,data);
    editId=null;
    toast('수정되었습니다 ✓','ok');
  } else {
    addProd(curCat,data);
    toast('저장되었습니다 ✓','ok');
  }
  renderProdModal();
  // 점수 업데이트
  if(curTab==='home')setTimeout(renderHome,300);
};

/* bindCalc */
function bindCalc(){
  const cat=curCat;
  if(cat==='insurance'){
    const el=document.getElementById('insCalc'); if(!el)return;
    const start=document.querySelector('[data-key="startDate"]')?.value;
    const prem=n(document.querySelector('[data-key="premium"]')?.value);
    if(!start||!prem){el.style.display='none';return;}
    const months=monthsDiff(start);
    const total=prem*months;
    el.style.display='block';
    el.innerHTML=`<b>가입기간</b> ${Math.floor(months/12)}년 ${months%12}개월 &nbsp;|&nbsp; <b>총 납입액</b> ${fmtAmt(total)}`;
  }
  if(cat==='savings'){
    const el=document.getElementById('savCalc'); if(!el)return;
    const m=n(document.querySelector('[data-key="monthly"]')?.value);
    const tot=n(document.querySelector('[data-key="totalCount"]')?.value);
    const done=n(document.querySelector('[data-key="doneCount"]')?.value);
    const rate=n(document.querySelector('[data-key="rate"]')?.value)/100/12;
    if(!m||!tot){el.style.display='none';return;}
    const current=m*done;
    const maturity=m*tot*(1+rate*tot/2);
    el.style.display='block';
    el.innerHTML=`<b>현재 적립</b> ${fmtAmt(current)} &nbsp;|&nbsp; <b>만기 예상</b> ${fmtAmt(Math.round(maturity))}`;
  }
  if(cat==='realestate'){
    const type=document.querySelector('[data-key="type"]')?.value||'';
    const rentRow=document.getElementById('reRentRow');
    const jeonseRow=document.getElementById('reJeonseRow');
    const ownerRows=document.getElementById('reOwnerRows');
    const isRent = type==='전세'||type==='월세';
    if(rentRow) rentRow.style.display=type==='월세'?'block':'none';
    if(jeonseRow) jeonseRow.style.display=type==='전세'?'block':'none';
    if(ownerRows) ownerRows.style.display=isRent?'none':'block';
  }
}
